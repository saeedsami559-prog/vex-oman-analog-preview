name: Store NASA site photos
on:
  push:
    branches: [photos]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_photos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B photos-results
          git add web/public/photos
          git commit -m "NASA site photos (web-sized copies)"
          git push -f origin photos-results
