name: Fetch Oman places (Natural Earth + GeoNames)
on:
  push:
    branches: [places]
permissions:
  contents: write
jobs:
  places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_places.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B places-results
          git add data/processed/places
          git commit -m "Oman places"
          git push -f origin places-results
